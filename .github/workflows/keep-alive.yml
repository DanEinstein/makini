# Update RENDER_URL if the Render service hostname changes.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  RENDER_URL: https://makini.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sSf "${RENDER_URL}/api/health"
