# Render Blueprint: one web service + managed Postgres.
# Apply from the Render dashboard → New → Blueprint, pointing at this repo.
# Secrets listed with sync: false must be pasted in the Environment tab.

services:
  - type: web
    name: makini
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: node dist/makini/server/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: makini-db
          property: connectionString
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22.22.3"
      - key: NG_ALLOWED_HOSTS
        value: "makini.onrender.com,*.onrender.com,localhost,127.0.0.1"

databases:
  - name: makini-db
    plan: basic-256mb
